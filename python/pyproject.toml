[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plinth-client"
version = "0.1.0"
authors = [
    { name = "Aneesh Krishna" }
]
description = "Pure Python client and CLI for the Plinth stream-relational engine"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Database :: Database Engines/Servers",
]
dependencies = []

[project.scripts]
plinth = "plinth.cli:main"
plinth-tui = "plinth.tui:main"
